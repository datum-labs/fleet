apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineclaims.fleet.datumapis.com
spec:
  group: fleet.datumapis.com
  scope: Namespaced
  names:
    kind: MachineClaim
    listKind: MachineClaimList
    plural: machineclaims
    singular: machineclaim
    shortNames: [mclaim]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Class
          type: string
          jsonPath: .spec.machineClassRef.name
        - name: Location
          type: string
          jsonPath: .spec.locationRef.name
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [machineClassRef, locationRef]
              properties:
                machineClassRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
                locationRef:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string, minLength: 1, maxLength: 253}
              x-kubernetes-validations:
                - rule: "self.machineClassRef == oldSelf.machineClassRef"
                  message: machineClassRef is immutable
                - rule: "self.locationRef == oldSelf.locationRef"
                  message: locationRef is immutable
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64, minimum: 0}
                phase:
                  type: string
                  enum: [Pending, Bound, Releasing]
                allocationHandle:
                  type: string
                  maxLength: 253
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string, maxLength: 316}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      reason: {type: string, minLength: 1, maxLength: 1024}
                      message: {type: string, maxLength: 32768}
                      lastTransitionTime: {type: string, format: date-time}
