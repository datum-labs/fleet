apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: machineclasses.fleet.datumapis.com
spec:
  group: fleet.datumapis.com
  scope: Cluster
  names:
    kind: MachineClass
    listKind: MachineClassList
    plural: machineclasses
    singular: machineclass
    shortNames: [mclass]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Resolved
          type: string
          jsonPath: .status.conditions[?(@.type=="Resolved")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              properties:
                source:
                  type: object
                  required: [project, name]
                  properties:
                    project:
                      type: string
                      minLength: 1
                      maxLength: 253
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                definition:
                  type: object
                  required: [architecture, capacity]
                  properties:
                    architecture:
                      type: string
                      minLength: 1
                      maxLength: 64
                    capabilities:
                      type: array
                      maxItems: 64
                      items:
                        type: string
                        minLength: 1
                        maxLength: 128
                      x-kubernetes-list-type: set
                    capacity:
                      type: object
                      required: [namespace, providerClassRef]
                      properties:
                        namespace:
                          type: string
                          minLength: 1
                          maxLength: 63
                        matchLabels:
                          type: object
                          maxProperties: 64
                          additionalProperties:
                            type: string
                        providerClassRef:
                          type: object
                          required: [apiGroup, kind, namespace, name]
                          properties:
                            apiGroup: {type: string, minLength: 1, maxLength: 253}
                            kind: {type: string, minLength: 1, maxLength: 63}
                            namespace: {type: string, minLength: 1, maxLength: 63}
                            name: {type: string, minLength: 1, maxLength: 253}
              x-kubernetes-validations:
                - rule: "has(self.source) != has(self.definition)"
                  message: exactly one of source and definition must be set
                - rule: "self == oldSelf"
                  message: a machine class definition or source is immutable
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  minimum: 0
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type: {type: string, maxLength: 316}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      observedGeneration: {type: integer, format: int64, minimum: 0}
                      reason: {type: string, minLength: 1, maxLength: 1024}
                      message: {type: string, maxLength: 32768}
                      lastTransitionTime: {type: string, format: date-time}
